<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slopus</title>
    <!-- Parser-blocking on purpose: it paints the saved theme's ground before
         anything reaches the screen, so a light-theme user never sees the dark
         window flash through. Must stay a classic same-origin script — the
         app's CSP forbids inline script, and a module would be deferred past
         the first paint. See public/theme-boot.js. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
