[package]
name = "slopus"
version = "0.2.0"
description = "An AI media harness for planning, generating, and editing media locally."
authors = ["Slopus"]
edition = "2021"
default-run = "slopus"
# `u32::is_multiple_of` (used by the date validator) stabilised in 1.87; an
# older toolchain otherwise fails with a confusing "no method named".
rust-version = "1.87"

[lib]
name = "slopus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
libloading = "0.8"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
jpeg-encoder = "0.6"
# Keep image decoding compatible with the package's Rust 1.87 minimum.
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
tauri-plugin-window-state = "2"
# LAN generation workers: the worker serves HTTP and both sides use mDNS.
tiny_http = "0.12"
mdns-sd = "0.21"

[target.'cfg(windows)'.dependencies]
# Must stay on the same major as wry's, or with_webview hands back a controller
# of a different crate's type. Used for the browser-accelerator switch (app.rs).
webview2-com = "0.38"
# The native shell (native_shell.rs): UI_ViewManagement reads the Windows
# accent colours, the Wdk / SystemInformation pair reads the real OS build to
# decide whether Mica exists, Dwm asks for rounded corners on the frameless
# window, and KeyboardAndMouse replays Ctrl+X/C/V/A for the text context menu.
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Foundation",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
