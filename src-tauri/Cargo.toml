[package]
name = "slopus"
version = "0.1.1"
description = "An AI media harness for planning, generating, and editing media locally."
authors = ["Slopus"]
edition = "2021"
default-run = "slopus"
# `u32::is_multiple_of` (used by the date validator) stabilised in 1.87; an
# older toolchain otherwise fails with a confusing "no method named".
rust-version = "1.87"

[lib]
name = "slopus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
libloading = "0.8"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
jpeg-encoder = "0.6"
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
